<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Suchauftrag erteilen | pycruit</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(/assets/fonts/inter-400.woff2)}@font-face{font-family:Inter;font-weight:600;src:url(/assets/fonts/inter-600.woff2)}@font-face{font-family:'Inter Tight';font-weight:800;src:url(/assets/fonts/inter-tight-800.woff2)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#F6F6F8;color:#191919;font-size:15px;line-height:1.55}
.top{height:62px;background:#fff;border-bottom:1px solid #ECECEE;display:flex;align-items:center;padding:0 20px}.top img{height:28px}
.wrap{max-width:720px;margin:28px auto;padding:0 16px}
.card{background:#fff;border:1px solid #ECECEE;border-radius:16px;padding:24px;margin-bottom:14px}
h1{font-family:'Inter Tight',Inter;font-size:26px;margin:0 0 4px;line-height:1.2}h2{font-size:16px;margin:18px 0 6px}.sub{color:#666;margin-bottom:10px}
table{border-collapse:collapse;width:100%}td{padding:5px 0;vertical-align:top;border-bottom:1px solid #F2F2F4}td:first-child{color:#666;width:150px;padding-right:12px}
ul{margin:4px 0 0 18px;padding:0}li{margin:2px 0}
.kond{background:#FAF7FB;border-left:3px solid #D2126C;border-radius:8px;padding:10px 12px;margin-top:8px}
label{display:block;font-size:13px;color:#555;margin:12px 0 4px}input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #DADADF;border-radius:10px;background:#fff}textarea{min-height:110px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:#333}.chk input{margin-top:4px;flex:none;width:18px;height:18px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(90deg,#EE3934,#D2126C);margin-top:16px}.btn:disabled{opacity:.5}
.btn2{border:1px solid #CFCFCF;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:#fff;margin-top:10px}
.msg{margin-top:12px;font-size:14px}.msg.err{color:#B00020}.msg.ok{color:#17663A}
.ok-box{text-align:center;padding:30px 10px}.ok-box b{display:block;font-size:20px;margin-bottom:6px}
.hint{color:#777;font-size:13px}a{color:#A50E55}
</style></head><body>
<div class="top"><img src="/assets/logo.png" alt="pycruit"></div>
<div class="wrap" id="app"><div class="card"><div class="hint">Einen Moment …</div></div></div>
<script>
(function(){
var ZIEL='https://ccpycruit.app.n8n.cloud/webhook/pycruit-auftragsbestaetigung';
var h=new URLSearchParams(location.hash.slice(1));var D=h.get('d')||'',A=h.get('a')||'';var app=document.getElementById('app');var X=null;
function e(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function post(o){return fetch(ZIEL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({d:D,a:A},o))}).then(function(r){return r.json()})}
function nur(t){app.innerHTML='<div class="card"><div class="ok-box">'+t+'</div></div>'}
function erteiltBox(er){var du=X&&X.du;nur('<b>Vielen Dank, der Suchauftrag ist erteilt.</b>Erteilt am '+e(er.am)+(er.name?' von '+e(er.name):'')+'.<br>'+(du?'Wir legen jetzt los und melden uns bei dir.':'Wir legen jetzt los und melden uns bei Ihnen.'))}
if(!/^\d+$/.test(D)||!/^[a-f0-9]{32}$/.test(A)){nur('Der Link ist unvollständig. Bitte verwenden Sie den Link aus unserer E-Mail.');return}
post({aktion:'laden'}).then(function(r){
 if(!r||!r.ok){nur(e((r&&r.fehler)||'Der Link ist ungültig.'));return}
 X=r;if(r.erteilt){erteiltBox(r.erteilt);return}
 var du=!!r.du;
 var h='<div class="card"><h1>Suchauftrag erteilen</h1><div class="sub">'+e(r.firma)+' · '+e(r.stelle)+'</div>'
  +'<table>'+(r.zeilen||[]).map(function(z){return '<tr><td>'+e(z[0])+'</td><td>'+e(z[1])+'</td></tr>'}).join('')+'</table>'
  +((r.aufgaben||[]).length?'<h2>Aufgaben</h2><ul>'+r.aufgaben.map(function(x){return '<li>'+e(x)+'</li>'}).join('')+'</ul>':'')
  +((r.muss||[]).length?'<h2>Muss-Kriterien</h2><ul>'+r.muss.map(function(x){return '<li>'+e(x)+'</li>'}).join('')+'</ul>':'')
  +'<h2>Konditionen</h2><div class="kond">'+e(r.kond)+' <a href="'+e(r.agb_url)+'" target="_blank" rel="noopener">AGB ansehen</a></div></div>'
  +'<div class="card"><h2 style="margin-top:0">Auftrag erteilen</h2>'
  +'<label for="name">'+(du?'Dein Name':'Ihr Name')+'</label><input type="text" id="name" maxlength="120" autocomplete="name">'
  +(r.agb_bekannt?'<p class="hint" style="margin-top:14px">Wie bei unseren bisherigen Aufträgen gelten unsere <a href="'+e(r.agb_url)+'" target="_blank" rel="noopener">AGB für die Personalvermittlung</a> ('+e(r.fassung)+'). Mit dem Klick erteilen '+(du?'du':'Sie')+' den Auftrag zu den oben genannten Eckdaten.</p>':'<label class="chk"><input type="checkbox" id="agb"><span>Ich habe die <a href="'+e(r.agb_url)+'" target="_blank" rel="noopener">AGB für die Personalvermittlung</a> ('+e(r.fassung)+') gelesen und akzeptiere sie. Ich handle als Unternehmer im Sinne von § 14 BGB und bin berechtigt, den Auftrag zu erteilen.</span></label>')
  +'<button class="btn" id="b-ja">Suchauftrag verbindlich erteilen</button><div class="msg" id="m1"></div></div>'
  +'<div class="card"><h2 style="margin-top:0">Noch etwas klären?</h2><div class="hint">'+(du?'Wenn du etwas anpassen möchtest oder Fragen hast, schreib es hier kurz rein oder antworte einfach auf unsere E-Mail. Der Auftrag gilt dann noch nicht als erteilt.':'Wenn Sie etwas anpassen möchten oder Fragen haben, schreiben Sie es hier kurz hinein oder antworten Sie einfach auf unsere E-Mail. Der Auftrag gilt dann noch nicht als erteilt.')+'</div>'
  +'<textarea id="frage" maxlength="3000" placeholder="'+(du?'Deine Rückfrage oder dein Änderungswunsch':'Ihre Rückfrage oder Ihr Änderungswunsch')+'"></textarea><button class="btn2" id="b-frage">Rückfrage senden</button><div class="msg" id="m2"></div></div>'
  +'<p class="hint">pycruit GmbH · Döbelner Straße 4B · 12627 Berlin</p>';
 app.innerHTML=h;
 var $=function(i){return document.getElementById(i)};
 $('b-ja').onclick=function(){var m=$('m1');var n=$('name').value.trim();if(n.length<3){m.className='msg err';m.textContent=du?'Bitte gib deinen Namen an.':'Bitte geben Sie Ihren Namen an.';return}if(!r.agb_bekannt&&!$('agb').checked){m.className='msg err';m.textContent=du?'Bitte bestätige die AGB.':'Bitte bestätigen Sie die AGB.';return}
  var b=this;b.disabled=true;b.textContent='Wird übermittelt …';post({aktion:'erteilen',name:n,agb_ok:r.agb_bekannt?false:true}).then(function(x){if(x&&x.ok&&x.erteilt){erteiltBox(x.erteilt);return}b.disabled=false;b.textContent='Suchauftrag verbindlich erteilen';m.className='msg err';m.textContent=(x&&x.fehler)||'Das hat nicht geklappt. Bitte versuchen Sie es noch einmal.'}).catch(function(){b.disabled=false;b.textContent='Suchauftrag verbindlich erteilen';m.className='msg err';m.textContent='Keine Verbindung. Bitte versuchen Sie es noch einmal.'})};
 $('b-frage').onclick=function(){var m=$('m2');var t=$('frage').value.trim();if(t.length<5){m.className='msg err';m.textContent=du?'Bitte schreib kurz, was wir klären sollen.':'Bitte schreiben Sie kurz, was wir klären sollen.';return}
  var b=this;b.disabled=true;post({aktion:'rueckfrage',text:t,name:$('name').value.trim()}).then(function(x){b.disabled=false;if(x&&x.ok){$('frage').value='';m.className='msg ok';m.textContent=du?'Danke, deine Nachricht ist bei uns angekommen. Wir melden uns kurzfristig.':'Danke, Ihre Nachricht ist bei uns angekommen. Wir melden uns kurzfristig.'}else{m.className='msg err';m.textContent=(x&&x.fehler)||'Das hat nicht geklappt.'}}).catch(function(){b.disabled=false;m.className='msg err';m.textContent='Keine Verbindung.'})};
}).catch(function(){nur('Keine Verbindung. Bitte versuchen Sie es später noch einmal.')});
})();
</script></body></html>
